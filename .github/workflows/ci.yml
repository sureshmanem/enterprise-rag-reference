name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # "Run workflow" button in the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      ANONYMIZED_TELEMETRY: "False"
      RAG_PROVIDER: openai
      RAG_OPENAI_API_KEY: ${{ secrets.RAG_OPENAI_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests eval
      - run: pytest -q
      - name: Retrieval evaluation
        if: ${{ env.RAG_OPENAI_API_KEY != '' && matrix.python-version == '3.12' }}
        # With LANGSMITH_API_KEY set, each run is logged as an experiment on the rag-mini-golden
        # dataset, tagged with commit, branch and CI run URL. Tests themselves are never traced.
        run: |
          if [ -n "$LANGSMITH_API_KEY" ]; then
            python eval/run_eval.py --langsmith
          else
            python eval/run_eval.py
          fi
